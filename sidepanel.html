<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chute</title><link rel="stylesheet" href="sidepanel.css"></head>
<body>
  <header><div><h1>Chute</h1><p>One local folder, beside the browser.</p></div><button id="choose" type="button">Choose location</button></header>
  <section id="setup" class="setup" hidden><div class="chutty" aria-hidden="true"><b>•ᴗ•</b><span>CHUTE</span></div><h2>Choose Chute's home</h2><p>Pick a permitted parent location. Chrome will ask for access, then Chute creates or reuses a <strong>Chute</strong> folder inside it.</p><button id="setup-choose" class="primary" type="button">Choose parent location</button><button id="reconnect" type="button" hidden>Reconnect remembered Chute</button></section>
  <section id="browser" hidden>
    <nav><button id="back" title="Back" type="button">‹</button><button id="home" title="Chute home" type="button">⌂</button><div id="crumbs" aria-label="Current folder"></div></nav>
    <div class="tools"><input id="search" type="search" placeholder="Search all of Chute…" autocomplete="off"><select id="limit" title="Items per page"><option>25</option><option selected>50</option><option>100</option><option>250</option></select></div>
    <div id="status" role="status"></div><main id="entries"></main>
    <footer><button id="prev" type="button">Previous</button><span id="page"></span><button id="next" type="button">Next</button></footer>
  </section>
  <script type="module" src="sidepanel.js"></script>
</body></html>
